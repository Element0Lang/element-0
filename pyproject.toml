[project]
name = "element-0"
version = "0.1.0"
description = "The Python environment for the Element-0 project"

requires-python = ">=3.10,<4.0"
dependencies = [
    "python-dotenv>=1.1.0",
    "pre-commit>=4.2.0"
]

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.6.12"
]
dev = [
    "pytest>=8.0.1",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
    "pytest-asyncio>=0.26.0",
    "mypy>=1.11.1",
    "ruff>=0.9.3",
    "icecream>=2.1.4"
]
